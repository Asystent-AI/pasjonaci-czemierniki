baseURL = 'https://pasjonaci.czemierniki.org/'
languageCode = 'pl-pl'
defaultContentLanguage = 'pl'
title = 'Klub Pasjonatów Ogrodnictwa'
enableRobotsTXT = true

[params]
  opis = 'Klub Pasjonatów Ogrodnictwa działa przy Kole Gospodyń Wiejskich Czemierniki. Spotkania, konkursy, plenery, lokalna pomoc, wymiana nasionami i sadzonkami. Udział całkowicie darmowy.'
  telefon = '795 716 644'
  email = 'kgw.czemierniki@gmail.com'
  facebook = 'https://www.facebook.com/kgw.czemierniki'
  # Statystyki: skrypt z własnej domeny (Traefik przepuszcza tylko /statystyki/script.js
  # i /statystyki/api/send do kontenera umami). Panel: https://statystyki.czemierniki.org
  umami = '/statystyki/script.js'
  umamiId = '5ecb769b-ea35-4d27-9cc8-8210c11a2b0c'

[markup.goldmark.renderer]
  unsafe = true

# spis treści podstron tekstowych: tylko nagłówki h2, inaczej rozrasta się
# do trzech poziomów i przestaje być skrótem
[markup.tableOfContents]
  startLevel = 2
  endLevel = 2
  ordered = false

[menus]
  # KGW Czemierniki prowadzi na strone glowna Kola: jedna rodzina, dwa adresy
  [[menus.main]]
    name = 'KGW Czemierniki'
    url = 'https://kgw.czemierniki.org/'
    weight = 5
  [[menus.main]]
    name = 'Konkurs 2026'
    pageRef = '/konkurs'
    weight = 10
  [[menus.main]]
    name = 'Wesprzyj nas'
    pageRef = '/wesprzyj'
    weight = 20
  [[menus.main]]
    name = 'Kontakt'
    pageRef = '/kontakt'
    weight = 30
